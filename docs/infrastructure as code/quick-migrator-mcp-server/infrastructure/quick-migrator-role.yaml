AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Quick Space Migrator - cross-account QuickSight role (quick-space-migrator-role).
  Deploy this in EACH source/target account. Creates a role the AgentCore
  runner account can assume (sts:AssumeRole), with full QuickSight migration
  permissions plus S3 permissions to create/manage the knowledge-base-* buckets.

Parameters:
  RoleName:
    Type: String
    Default: quick-space-migrator-role
    Description: Name of the cross-account role (must match the ARN in the runner exec policy).

  RunnerExecRoleArn:
    Type: String
    Description: >
      ARN of the runner's AgentCore execution role (output ExecutionRoleArn from
      cfn-runner-role.yaml), e.g.
      arn:aws:iam::111122223333:role/quick_space_migrator-exec-role.
      Trusted directly as the Principal. Deploy cfn-runner-role.yaml FIRST so
      this role exists before it is referenced here.

  ExternalId:
    Type: String
    Default: ""
    Description: Optional ExternalId to require on AssumeRole (leave blank to disable).

Conditions:
  UseExternalId: !Not [!Equals [!Ref ExternalId, ""]]

Resources:

  # ── QuickSight migration permissions ──
  QuickMigrationPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${RoleName}-quicksight-policy"
      Description: QuickSight migration permissions for the Quick Space Migrator.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: QuickSightMigrationScoped
            Effect: Allow
            Resource:
              - !Sub "arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:account/*"
              - !Sub "arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:action-connector/*"
              - !Sub "arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:agent/*"
              - !Sub "arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:analysis/*"
              - !Sub "arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:asset-bundle-export-job/*"
              - !Sub "arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:asset-bundle-import-job/*"
              - !Sub "arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:automation-group/*"
              - !Sub "arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:brand/*"
              - !Sub "arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:customization/*"
              - !Sub "arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:custompermissions/*"
              - !Sub "arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:dashboard/*"
              - !Sub "arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:dataset/*"
              - !Sub "arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:datasource/*"
              - !Sub "arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:email-customization-template/*"
              - !Sub "arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:extension-access/*"
              - !Sub "arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:flow/*"
              - !Sub "arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:folder/*"
              - !Sub "arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:group/*"
              - !Sub "arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:knowledge-base/*"
              - !Sub "arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:namespace/*"
              - !Sub "arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:oauthClientApplication/*"
              - !Sub "arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:space/*"
              - !Sub "arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:template/*"
              - !Sub "arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:theme/*"
              - !Sub "arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:topic/*"
              - !Sub "arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:user/*"
              - !Sub "arn:${AWS::Partition}:quicksight:${AWS::Region}:${AWS::AccountId}:vpcConnection/*"
            Action:
              - quicksight:BatchDeleteKnowledgeBase
              - quicksight:CreateActionConnector
              - quicksight:CreateAgent
              - quicksight:CreateCustomPermissions
              - quicksight:CreateSpace
              - quicksight:DeleteActionConnector
              - quicksight:DeleteAgent
              - quicksight:DeleteDataSource
              - quicksight:DeleteKnowledgeBase
              - quicksight:DeleteSpace
              - quicksight:DescribeAccountCustomization
              - quicksight:DescribeAccountSubscription
              - quicksight:DescribeActionConnector
              - quicksight:DescribeActionConnectorPermissions
              - quicksight:DescribeAgent
              - quicksight:DescribeAgentPermissions
              - quicksight:DescribeAnalysis
              - quicksight:DescribeAnalysisPermissions
              - quicksight:DescribeAssetBundleExportJob
              - quicksight:DescribeAssetBundleImportJob
              - quicksight:DescribeAutomationJob
              - quicksight:DescribeBrand
              - quicksight:DescribeBrandPublishedVersion
              - quicksight:DescribeCustomPermissions
              - quicksight:DescribeDashboard
              - quicksight:DescribeDashboardPermissions
              - quicksight:DescribeDashboardSnapshotJob
              - quicksight:DescribeDashboardSnapshotJobResult
              - quicksight:DescribeDataSet
              - quicksight:DescribeDataSetRefreshProperties
              - quicksight:DescribeDataSource
              - quicksight:DescribeEmailCustomizationTemplate
              - quicksight:DescribeExtensionAccess
              - quicksight:DescribeFlow
              - quicksight:DescribeFolder
              - quicksight:DescribeFolderPermissions
              - quicksight:DescribeFolderResolvedPermissions
              - quicksight:DescribeGroup
              - quicksight:DescribeGroupMembership
              - quicksight:DescribeIngestion
              - quicksight:DescribeKnowledgeBase
              - quicksight:DescribeKnowledgeBasePermissions
              - quicksight:DescribeNamespace
              - quicksight:DescribeOAuthClientApplication
              - quicksight:DescribeRefreshSchedule
              - quicksight:DescribeSpace
              - quicksight:DescribeSpacePermissions
              - quicksight:DescribeTemplate
              - quicksight:DescribeTemplateAlias
              - quicksight:DescribeTemplatePermissions
              - quicksight:DescribeTheme
              - quicksight:DescribeThemeAlias
              - quicksight:DescribeThemePermissions
              - quicksight:DescribeTopic
              - quicksight:DescribeTopicRefresh
              - quicksight:DescribeTopicRefreshSchedule
              - quicksight:DescribeUser
              - quicksight:DescribeVPCConnection
              - quicksight:GetAuthCode
              - quicksight:GetDashboardEmbedUrl
              - quicksight:GetFlowMetadata
              - quicksight:GetFlowPermissions
              - quicksight:GetIdentityContext
              - quicksight:ListAgents
              - quicksight:ListAnalyses
              - quicksight:ListAssetBundleExportJobs
              - quicksight:ListAssetBundleImportJobs
              - quicksight:ListDashboardVersions
              - quicksight:ListDashboards
              - quicksight:ListFolderMembers
              - quicksight:ListFolders
              - quicksight:ListFoldersForResource
              - quicksight:ListGroupMemberships
              - quicksight:ListGroups
              - quicksight:ListSelfUpgrades
              - quicksight:ListSpaceResources
              - quicksight:ListTagsForResource
              - quicksight:ListTemplateAliases
              - quicksight:ListTemplateVersions
              - quicksight:ListTemplates
              - quicksight:ListThemeAliases
              - quicksight:ListThemeVersions
              - quicksight:ListThemes
              - quicksight:ListUserGroups
              - quicksight:ListUsers
              - quicksight:PassDataSet
              - quicksight:PassDataSource
              - quicksight:PredictQAResults
              - quicksight:SearchActionConnectors
              - quicksight:SearchAgents
              - quicksight:SearchAnalyses
              - quicksight:SearchDashboards
              - quicksight:SearchDataSets
              - quicksight:SearchDataSources
              - quicksight:SearchFolders
              - quicksight:SearchGroups
              - quicksight:SearchKnowledgeBases
              - quicksight:SearchTopics
              - quicksight:SearchUsers
              - quicksight:UpdateActionConnector
              - quicksight:UpdateActionConnectorPermissions
              - quicksight:UpdateAgent
              - quicksight:UpdateAgentPermissions
              - quicksight:UpdateCustomPermissions
              - quicksight:UpdateDataSource
              - quicksight:UpdateKnowledgeBasePermissions
              - quicksight:UpdateSpace
              - quicksight:UpdateSpacePermissions
              - quicksight:UpdateSpaceResources
          - Sid: QuickSightMigrationAccountLevel
            # These actions do not support resource-level permissions in IAM
            # (List*/Search*/account-level Describe*, and preview APIs not yet in
            # the Service Authorization Reference). They require Resource "*".
            # QuickSight still confines them to the caller's own AwsAccountId.
            Effect: Allow
            Resource: "*"
            Action:
              - quicksight:BatchGetPreferences
              - quicksight:BatchUpdatePreferences
              - quicksight:CreateDataSource
              - quicksight:CreateKnowledgeBase
              - quicksight:DescribeAccountCustomPermission
              - quicksight:DescribeAccountSettings
              - quicksight:DescribeAutomationGroup
              - quicksight:DescribeBrandAssignment
              - quicksight:DescribeChatConfiguration
              - quicksight:DescribeDashboardsQAConfiguration
              - quicksight:DescribeDefaultQBusinessApplication
              - quicksight:DescribeIAMPolicyAssignment
              - quicksight:DescribeIpRestriction
              - quicksight:DescribeKeyRegistration
              - quicksight:DescribeLimitsProfile
              - quicksight:DescribeQPersonalizationConfiguration
              - quicksight:DescribeQuickIndexCapacity
              - quicksight:DescribeQuickSightQSearchConfiguration
              - quicksight:DescribeRoleCustomPermission
              - quicksight:DescribeSelfUpgradeConfiguration
              - quicksight:GetAnonymousUserEmbedUrl
              - quicksight:GetCustomPermissionsSummary
              - quicksight:GetGroupMapping
              - quicksight:GetSessionEmbedUrl
              - quicksight:ListActionConnectors
              - quicksight:ListAssignmentsForPrincipal
              - quicksight:ListAutomationGroups
              - quicksight:ListBrands
              - quicksight:ListCustomPermissions
              - quicksight:ListCustomerManagedKeys
              - quicksight:ListDataSets
              - quicksight:ListDataSources
              - quicksight:ListExtensionAccesses
              - quicksight:ListFlows
              - quicksight:ListIAMPolicyAssignments
              - quicksight:ListIAMPolicyAssignmentsForUser
              - quicksight:ListIdentityPropagationConfigs
              - quicksight:ListIngestions
              - quicksight:ListKMSKeysForUser
              - quicksight:ListKnowledgeBases
              - quicksight:ListLimitsProfiles
              - quicksight:ListNamespaces
              - quicksight:ListOAuthClientApplications
              - quicksight:ListProfileAssignments
              - quicksight:ListRefreshSchedules
              - quicksight:ListRoleMemberships
              - quicksight:ListSpaces
              - quicksight:ListTopicRefreshSchedules
              - quicksight:ListTopicReviewedAnswers
              - quicksight:ListTopics
              - quicksight:ListUsersIndexCapacity
              - quicksight:ListVPCConnections
              - quicksight:QuickSuiteUsageMetrics
              - quicksight:SearchAutomationGroups
              - quicksight:SearchDirectoryGroups
              - quicksight:SearchFlows
              - quicksight:SearchSpaces
              - quicksight:UpdateKnowledgeBase
              - quicksight:UpdateResourcePermissions

  # ── S3 permissions to create/manage the knowledge-base-* buckets ──
  KnowledgeBaseS3Policy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${RoleName}-kb-s3-policy"
      Description: S3 permissions for the migrator to create and manage knowledge-base-* buckets.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ListAllBuckets
            Effect: Allow
            Action: s3:ListAllMyBuckets
            Resource: "*"
          - Sid: KnowledgeBaseBucketAdmin
            Effect: Allow
            Action:
              - s3:CreateBucket
              - s3:PutBucketPolicy
              - s3:GetBucketPolicy
              - s3:PutBucketVersioning
              - s3:GetBucketVersioning
              - s3:PutBucketPublicAccessBlock
              - s3:PutEncryptionConfiguration
              - s3:GetBucketLocation
              - s3:ListBucket
            Resource: "arn:aws:s3:::knowledge-base-*"
          - Sid: KnowledgeBaseObjects
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:PutObject
              - s3:DeleteObject
              - s3:ListBucketVersions
            Resource: "arn:aws:s3:::knowledge-base-*/*"

  # ── IAM read permission so the migrator can preflight-verify the QuickSight service role ──
  ServiceRoleReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${RoleName}-iam-read-policy"
      Description: Allows the migrator to verify the QuickSight service role exists + its trust policy.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: GetQuickSightServiceRole
            Effect: Allow
            Action:
              - iam:GetRole
            # The QuickSight service-role name is a user-supplied input and can be
            # anything, so iam:GetRole is scoped to any role in this account.
            Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/*"

  # ── The cross-account role ──
  QuickSpaceAgentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            # Trust the runner execution role directly. cfn-runner-role.yaml is
            # deployed FIRST, so this role already exists when referenced here.
            Principal:
              AWS: !Ref RunnerExecRoleArn
            Action: sts:AssumeRole
            Condition: !If
              - UseExternalId
              - StringEquals:
                  sts:ExternalId: !Ref ExternalId
              - !Ref "AWS::NoValue"
      ManagedPolicyArns:
        - !Ref QuickMigrationPolicy
        - !Ref KnowledgeBaseS3Policy
        - !Ref ServiceRoleReadPolicy

Outputs:
  RoleArn:
    Description: ARN of the created cross-account role (use in the runner exec policy + env vars).
    Value: !GetAtt QuickSpaceAgentRole.Arn
  RoleName:
    Value: !Ref RoleName
